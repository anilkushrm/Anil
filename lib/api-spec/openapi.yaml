components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 20 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, agent] }
    Workspace:
      type: object
      required: [id, name, slug, plan]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        plan: { type: string, enum: [basic, starter, growth, enterprise] }
        walletBalance: { type: number }
    WorkspaceUpdate:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", minLength: 2, maxLength: 80 }
    Session:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        workspace:
          anyOf:
            - $ref: "#/components/schemas/Workspace"
            - type: "null"
    RegisterInput:
      type: object
      required: [name, email, password, workspaceName]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
        workspaceName: { type: string, minLength: 2, maxLength: 100 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 1, maxLength: 128 }
        workspaceSlug: { type: string, maxLength: 80 }
    Dashboard:
      type: object
      required: [metrics, pipeline, recentActivity]
      properties:
        metrics:
          type: object
          required: [leads, messages, contacts, campaigns]
          properties:
            leads: { type: number }
            messages: { type: number }
            contacts: { type: number }
            campaigns: { type: number }
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/PipelineMetric"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    PipelineMetric:
      type: object
      required: [stage, count, value]
      properties:
        stage: { type: string }
        count: { type: number }
        value: { type: number }
    Activity:
      type: object
      required: [id, title, detail, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
    Lead:
      type: object
      required: [id, name, company, email, phone, source, stage, value, assignee, messagingConsent, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        company: { type: string }
        email: { type: string }
        phone: { type: string }
        source: { type: string, enum: [whatsapp, instagram, facebook, website, manual] }
        stage: { type: string, enum: [new, contacted, qualified, proposal, won, lost] }
        value: { type: number }
        assignee: { type: string }
        tags:
          type: array
          items: { type: string }
        messagingConsent: { type: string, enum: [unknown, opted_in, opted_out] }
        optedOutAt:
          type: ["string", "null"]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeadInput:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        company: { type: string, maxLength: 100 }
        email: { type: string }
        phone: { type: string, maxLength: 30 }
        source: { type: string, enum: [whatsapp, instagram, facebook, website, manual], default: manual }
        stage: { type: string, enum: [new, contacted, qualified, proposal, won, lost], default: new }
        value: { type: number, minimum: 0, default: 0 }
        assignee: { type: string, maxLength: 80 }
        tags:
