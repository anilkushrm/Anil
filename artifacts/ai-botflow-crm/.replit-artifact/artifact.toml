kind = "web"
previewPath = "/"
title = "Ai Botflow CRM"
description = "A multi-tenant customer communication CRM for teams to manage leads, conversations, campaigns, and WhatsApp, Instagram, and Facebook channel setup from one workspace."
version = "1.0.0"
id = "artifacts/ai-botflow-crm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21459

[services.development]
run = "pnpm --filter @workspace/ai-botflow-crm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-botflow-crm", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-botflow-crm/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21459"
BASE_PATH = "/"
