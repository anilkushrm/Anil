openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ai Botflow CRM API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Workspace authentication
  - name: workspace
    description: Workspace and dashboard operations
  - name: leads
    description: Lead management
  - name: inbox
    description: Unified conversations
  - name: team
    description: Team management
  - name: channels
    description: Channel connection settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /codegen-validation:
    get:
      operationId: codegenValidation
      tags: [health]
      summary: Validate generated API drift detection
      responses:
        "204":
          description: Validation response
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an owner and workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /auth/invitations/{token}:
    get:
      operationId: getInvitation
      tags: [auth]
      summary: Get a pending team invitation
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationInfo"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [auth]
      summary: Accept a team invitation
      parameters:
        - $ref: "#/components/parameters/Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptInput"
      responses:
        "200":
          description: Activated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get the current workspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Update workspace profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [workspace]
      summary: Get dashboard metrics and activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List searchable leads
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: stage
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: number, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inbox/conversations:
    get:
      operationId: listConversations
      tags: [inbox]
      summary: List conversations
      parameters:
        - name: channel
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inbox/conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [inbox]
      summary: List messages in a conversation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: sendMessage
      tags: [inbox]
      summary: Add a message to a conversation
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List workspace team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Invite a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invitation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List channel connection states
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /channels/{id}:
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update channel setup state
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /channels/{id}/connect:
    get:
      operationId: connectChannel
      tags: [channels]
      summary: Start Meta OAuth or WhatsApp Embedded Signup
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Meta authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelConnectResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{id}/complete:
    post:
      operationId: completeEmbeddedChannelConnection
      tags: [channels]
      summary: Complete an authenticated WhatsApp Embedded Signup
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddedSignupCompletion"
      responses:
        "200":
          description: Connected channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/meta/callback:
    get:
      operationId: completeMetaChannelConnection
      tags: [channels]
      summary: Complete Meta OAuth
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Connected channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
  /channels/meta/select:
    post:
      operationId: selectMetaPage
      tags: [channels]
      summary: Select the Page used by a pending Meta connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaPageSelection"
      responses:
        "200":
          description: Connected channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /channels/meta/webhook:
    get:
      operationId: verifyMetaChannelWebhook
      tags: [channels]
      summary: Verify the Meta webhook subscription
      parameters:
        - name: hub.mode
          in: query
          schema: { type: string }
        - name: hub.verify_token
          in: query
          schema: { type: string }
        - name: hub.challenge
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Webhook challenge
          content:
            text/plain:
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: receiveMetaChannelWebhook
      tags: [channels]
      summary: Receive Meta channel messages and delivery receipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaWebhookPayload"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /flows:
    get:
      operationId: listFlows
      tags: [flows]
      responses:
        "200":
          description: Automation flows
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Flow" } }
    post:
      operationId: createFlow
      tags: [flows]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowInput" }
      responses:
        "201":
          description: Created flow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /flows/{id}:
    patch:
      operationId: updateFlow
      tags: [flows]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowUpdate" }
      responses:
        "200":
          description: Updated flow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        "404":
          $ref: "#/components/responses/NotFound"
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      responses:
        "200":
          description: Message templates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Template" } }
    post:
      operationId: createTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /templates/{id}:
    patch:
      operationId: updateTemplate
      tags: [templates]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateUpdate" }
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "404":
          $ref: "#/components/responses/NotFound"
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      responses:
        "200":
          description: Campaign drafts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } }
    post:
      operationId: createCampaign
      tags: [campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201":
          description: Created campaign draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignUpdate" }
      responses:
        "200":
          description: Updated campaign draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "404":
          $ref: "#/components/responses/NotFound"
  /knowledge:
    get:
      operationId: listKnowledgeSources
      tags: [knowledge]
      responses:
        "200":
          description: Knowledge sources
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeSource" } }
    post:
      operationId: createKnowledgeSource
      tags: [knowledge]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeSourceInput" }
      responses:
        "201":
          description: Created knowledge source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeSource" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /knowledge/{id}:
    delete:
      operationId: deleteKnowledgeSource
      tags: [knowledge]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /ai-settings:
    get:
      operationId: getAiSettings
      tags: [ai]
      responses:
        "200":
          description: Workspace AI settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettings" }
    patch:
      operationId: updateAiSettings
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsUpdate" }
      responses:
        "200":
          description: Updated AI settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettings" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /ai-inbound-events:
    post:
      operationId: processAiInboundEvent
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiInboundEventInput" }
      responses:
        "200":
          description: Provider-independent AI runtime result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiRuntimeResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai-memory:
    get:
      operationId: listAiMemoryItems
      tags: [ai]
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [product, faq] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: AI memory items
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AiMemoryItem" } }
    post:
      operationId: createAiMemoryItem
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiMemoryItemInput" }
      responses:
        "201":
          description: Created memory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMemoryItem" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /ai-memory/{id}:
    patch:
      operationId: updateAiMemoryItem
      tags: [ai]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiMemoryItemUpdate" }
      responses:
        "200":
          description: Updated memory item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMemoryItem" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAiMemoryItem
      tags: [ai]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404":
          $ref: "#/components/responses/NotFound"
  /ai-mappings:
    get:
      operationId: listAiMappings
      tags: [ai]
      responses:
        "200":
          description: CRM field mappings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AiMapping" } }
    post:
      operationId: createAiMapping
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiMappingInput" }
      responses:
        "201":
          description: Created mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMapping" }
  /ai-mappings/{id}:
    patch:
      operationId: updateAiMapping
      tags: [ai]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiMappingUpdate" }
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiMapping" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAiMapping
      tags: [ai]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404":
          $ref: "#/components/responses/NotFound"
  /ai-rules:
    get:
      operationId: listAiRules
      tags: [ai]
      responses:
        "200":
          description: Automatic CRM rules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AiRule" } }
    post:
      operationId: createAiRule
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRuleInput" }
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiRule" }
  /ai-rules/{id}:
    patch:
      operationId: updateAiRule
      tags: [ai]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRuleUpdate" }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiRule" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAiRule
      tags: [ai]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "404":
          $ref: "#/components/responses/NotFound"
  /sequences:
    get:
      operationId: listSequences
      tags: [sequences]
      responses:
        "200":
          description: Follow-up sequences with steps
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Sequence" } }
    post:
      operationId: createSequence
      tags: [sequences]
      requestBody:
        required: true
        content:
          application/json:
